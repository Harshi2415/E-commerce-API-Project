<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width = device-width, initial-scale=1.0">
        <link rel="stylesheet" href="website.css">
        <title>Product Explorer</title> 
    </head>
    <body>

        <header>
            <h1>PRODUCT <span style="color: red;">EXPLOReR</span></h1>

            <div class ="search">
            <input type="text" id="searchInput" placeholder="Search products...">
            <select id="categoryFilter"><option value="">All Categories</option></select>
            </div>
            

        </header>

        <main>
            <section id="productContainer">
                
            </section>
        </main>

        <div id="overlay"></div>

        <div id="productSidebar">
            <span id="closeSidebar">&times;</span>
            <img id="sidebarImage">
            <h2 id="sidebarTitle"></h2>
            <p id="sidebarPrice"></p>
            <p id="sidebarCategory"></p>
            <p id="sidebarBrand"></p>
            <p id="sidebarStock"></p>
            <p id="sidebarRating"></p>
            <p id="sidebarDescription"></p>
            <button class="cartbtn">Add to cart</button>
        </div>

        <section id="pagination">
            <button id="prevBtn">Back</button>
            <span id="pageNum"></span>
            <button id="nextBtn">Next</button>
        </section>

        <section id="footer">
            <p>© 2026 Harshita Chandila</p>
            <p>Built with HTML • CSS • JavaScript • DummyJSON API</p>
        </section>

        <script src="website.js"></script>

    </body>
</html>
